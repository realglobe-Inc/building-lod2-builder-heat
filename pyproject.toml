[project]
name = "building_lod2_builder_heat"
version = "0.1.0"
description = ""
authors = [
    { name = "fukuchidaisuke", email = "fukuchidaisuke@realglobe.jp" }
]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "heat", # 詳細は下で
    "loguru (>=0.7.3,<0.8.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "torchvision (>=0.28.0,<0.29.0)",
    "typer[all] (>=0.26.8,<0.27.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
extract-roofline = "building_lod2_builder_heat.commands.extract_roofline.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.15.21"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "SIM", "UP", "N", "TID"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.poetry.dependencies]
heat = { git = "https://github.com/realglobe-Inc/heat.git", branch = "2026-dev" }
